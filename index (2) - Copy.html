<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Online Chess</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #202020;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* LOGIN */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: min(400px, 100%);
      background: #292929;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      text-align: center;
    }

    .login-box h1 {
      margin: 0 0 10px;
    }

    .login-box p {
      color: #aaa;
      margin-bottom: 25px;
    }

    .login-box input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #444;
      border-radius: 8px;
      background: #151515;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .login-box input:focus {
      border-color: #f0d9b5;
    }

    button {
      padding: 11px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      background: #f0d9b5;
      color: #222;
      font-weight: bold;
    }

    button:hover {
      filter: brightness(1.08);
    }

    .login-box button {
      width: 100%;
      margin-top: 8px;
    }

    .secondary-button {
      background: #444;
      color: white;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #authMessage {
      min-height: 25px;
      margin-top: 15px;
      font-size: 14px;
    }

    /* GAME */

    #gameScreen {
      display: none;
      min-height: 100vh;
      padding: 20px;
      justify-content: center;
      align-items: center;
    }

    .game {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .topbar {
      width: min(90vw, 640px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user {
      color: #bbb;
      font-size: 14px;
      max-width: 70%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar button {
      background: #444;
      color: white;
    }

    .chessboard {
      width: min(90vw, 640px);
      aspect-ratio: 1 / 1;

      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);

      border: 6px solid #111;
      box-shadow: 0 15px 40px rgba(0,0,0,.6);
    }

    .square {
      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: clamp(30px, 9vw, 72px);

      cursor: pointer;
      user-select: none;
    }

    .light {
      background: #f0d9b5;
    }

    .dark {
      background: #b58863;
    }

    .square:hover {
      filter: brightness(1.08);
    }

    /* CHESS PIECES */

    .piece {
      position: relative;
      z-index: 3;
      line-height: 1;
    }

    /* White pieces:
       Cream fill + black outline,
       matching the reference image.
    */
    .white-piece {
      color: #f0d9b5;
      -webkit-text-stroke: 2px #111;
      paint-order: stroke fill;
      text-shadow: none;
    }

    /* Black pieces */
    .black-piece {
      color: #111;
      -webkit-text-stroke: 1px #111;
      text-shadow: none;
    }

    .selected {
      box-shadow: inset 0 0 0 5px #f6f669;
    }

    .valid-move::after {
      content: "";
      position: absolute;
      width: 24%;
      height: 24%;
      border-radius: 50%;
      background: rgba(0,0,0,.28);
      z-index: 2;
    }

    .capture-move::after {
      content: "";
      position: absolute;
      width: 82%;
      height: 82%;
      border-radius: 50%;
      border: 5px solid rgba(0,0,0,.25);
      z-index: 2;
    }

    .check {
      background: #e57373 !important;
    }

    .status {
      min-height: 28px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    @media (max-width: 500px) {
      #gameScreen {
        padding: 10px;
      }

      .chessboard {
        border-width: 3px;
      }

      .status {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div id="loginScreen">

    <div class="login-box">

      <h1>♟ Online Chess</h1>

      <p>Sign in to play</p>

      <input
        id="email"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button id="loginButton">
        Log In
      </button>

      <button
        id="signupButton"
        class="secondary-button"
      >
        Create Account
      </button>

      <div id="authMessage"></div>

    </div>

  </div>


  <!-- GAME -->

  <div id="gameScreen">

    <div class="game">

      <div class="topbar">

        <div
          class="user"
          id="userEmail"
        ></div>

        <button id="logoutButton">
          Log Out
        </button>

      </div>

      <div
        id="board"
        class="chessboard"
      ></div>

      <div
        id="status"
        class="status"
      >
        Loading...
      </div>

      <button id="resetButton">
        New Game
      </button>

    </div>

  </div>


  <!-- CHESS.JS -->

  <script type="module">

    import { Chess }
      from "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm";

    window.Chess = Chess;

    window.dispatchEvent(
      new Event("chessReady")
    );

  </script>


  <!-- MAIN JAVASCRIPT -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        /*
        =====================================================
        SUPABASE
        =====================================================
        */

        const SUPABASE_URL =
          "https://muadgwdwfdkghluqfccj.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
          "sb_publishable_wRwR5Jgkw8i-5fLRp8oRwQ_ZpEYT3dZ";


        const supabaseClient =
          window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
          );


        /*
        =====================================================
        ELEMENTS
        =====================================================
        */

        const loginScreen =
          document.getElementById(
            "loginScreen"
          );

        const gameScreen =
          document.getElementById(
            "gameScreen"
          );

        const boardElement =
          document.getElementById(
            "board"
          );

        const statusElement =
          document.getElementById(
            "status"
          );

        const authMessage =
          document.getElementById(
            "authMessage"
          );

        const emailInput =
          document.getElementById(
            "email"
          );

        const passwordInput =
          document.getElementById(
            "password"
          );

        const loginButton =
          document.getElementById(
            "loginButton"
          );

        const signupButton =
          document.getElementById(
            "signupButton"
          );

        const logoutButton =
          document.getElementById(
            "logoutButton"
          );

        const resetButton =
          document.getElementById(
            "resetButton"
          );

        const userEmail =
          document.getElementById(
            "userEmail"
          );


        /*
        =====================================================
        CHESS VARIABLES
        =====================================================
        */

        let chess = null;

        let selectedSquare = null;

        let validMoves = [];


        const pieces = {

          w: {
            k: "♔",
            q: "♕",
            r: "♖",
            b: "♗",
            n: "♘",
            p: "♙"
          },

          b: {
            k: "♚",
            q: "♛",
            r: "♜",
            b: "♝",
            n: "♞",
            p: "♟"
          }

        };


        /*
        =====================================================
        AUTH BUTTONS
        =====================================================
        */

        loginButton.addEventListener(
          "click",
          login
        );

        signupButton.addEventListener(
          "click",
          signup
        );

        logoutButton.addEventListener(
          "click",
          logout
        );

        resetButton.addEventListener(
          "click",
          resetGame
        );


        /*
        =====================================================
        LOGIN
        =====================================================
        */

        async function login() {

          const email =
            emailInput.value.trim();

          const password =
            passwordInput.value;


          if (!email || !password) {

            showMessage(
              "Enter your email and password.",
              false
            );

            return;
          }


          setButtons(true);

          showMessage(
            "Logging in...",
            true
          );


          try {

            const result =
              await supabaseClient.auth
                .signInWithPassword({

                  email: email,

                  password: password

                });


            if (result.error) {

              showMessage(
                result.error.message,
                false
              );

              setButtons(false);

              return;
            }


            if (result.data.user) {

              showGame(
                result.data.user
              );
            }


          } catch (error) {

            console.error(error);

            showMessage(
              "Login failed. Check your connection.",
              false
            );

            setButtons(false);
          }

        }


        /*
        =====================================================
        CREATE ACCOUNT
        =====================================================
        */

        async function signup() {

          const email =
            emailInput.value.trim();

          const password =
            passwordInput.value;


          if (!email || !password) {

            showMessage(
              "Enter an email and password first.",
              false
            );

            return;
          }


          if (password.length < 6) {

            showMessage(
              "Password must be at least 6 characters.",
              false
            );

            return;
          }


          setButtons(true);

          showMessage(
            "Creating account...",
            true
          );


          try {

            const result =
              await supabaseClient.auth
                .signUp({

                  email: email,

                  password: password

                });


            if (result.error) {

              showMessage(
                result.error.message,
                false
              );

              setButtons(false);

              return;
            }


            /*
              If Supabase automatically logs
              the user in.
            */

            if (
              result.data.session &&
              result.data.user
            ) {

              showGame(
                result.data.user
              );

              return;
            }


            /*
              Email verification required.
            */

            showMessage(
              "Account created! Check your email to verify your account.",
              true
            );

            setButtons(false);


          } catch (error) {

            console.error(error);

            showMessage(
              "Account creation failed.",
              false
            );

            setButtons(false);
          }

        }


        /*
        =====================================================
        MESSAGE
        =====================================================
        */

        function showMessage(
          message,
          success
        ) {

          authMessage.textContent =
            message;

          authMessage.style.color =
            success
              ? "#77dd77"
              : "#ff7777";
        }


        /*
        =====================================================
        BUTTON STATE
        =====================================================
        */

        function setButtons(
          disabled
        ) {

          loginButton.disabled =
            disabled;

          signupButton.disabled =
            disabled;

          loginButton.style.opacity =
            disabled ? ".6" : "1";

          signupButton.style.opacity =
            disabled ? ".6" : "1";
        }


        /*
        =====================================================
        SHOW GAME
        =====================================================
        */

        function showGame(user) {

          loginScreen.style.display =
            "none";

          gameScreen.style.display =
            "flex";

          userEmail.textContent =
            user.email || "Player";

          startChess();
        }


        /*
        =====================================================
        LOGOUT
        =====================================================
        */

        async function logout() {

          await supabaseClient.auth.signOut();

          chess = null;

          selectedSquare = null;

          validMoves = [];

          gameScreen.style.display =
            "none";

          loginScreen.style.display =
            "flex";

          emailInput.value = "";

          passwordInput.value = "";

          showMessage("", false);

          setButtons(false);
        }


        /*
        =====================================================
        SESSION
        =====================================================
        */

        async function checkSession() {

          try {

            const result =
              await supabaseClient.auth
                .getSession();


            if (
              result.data &&
              result.data.session
            ) {

              showGame(
                result.data.session.user
              );

            } else {

              loginScreen.style.display =
                "flex";

              gameScreen.style.display =
                "none";
            }

          } catch (error) {

            console.error(error);

            loginScreen.style.display =
              "flex";

            gameScreen.style.display =
              "none";
          }

        }


        /*
        =====================================================
        AUTH STATE
        =====================================================
        */

        supabaseClient.auth
          .onAuthStateChange(
            function(event, session) {

              if (
                event === "SIGNED_IN" &&
                session
              ) {

                showGame(
                  session.user
                );
              }


              if (
                event === "SIGNED_OUT"
              ) {

                loginScreen.style.display =
                  "flex";

                gameScreen.style.display =
                  "none";
              }

            }
          );


        /*
        =====================================================
        START CHESS
        =====================================================
        */

        function startChess() {

          if (!window.Chess) {

            statusElement.textContent =
              "Chess engine loading...";

            setTimeout(
              startChess,
              300
            );

            return;
          }


          chess =
            new window.Chess();

          selectedSquare = null;

          validMoves = [];

          drawBoard();

          updateStatus();
        }


        /*
        =====================================================
        RESET
        =====================================================
        */

        function resetGame() {

          if (!chess) {
            return;
          }

          chess.reset();

          selectedSquare = null;

          validMoves = [];

          drawBoard();

          updateStatus();
        }


        /*
        =====================================================
        DRAW BOARD
        =====================================================
        */

        function drawBoard() {

          if (!chess) {
            return;
          }


          boardElement.innerHTML =
            "";


          const board =
            chess.board();


          for (
            let row = 0;
            row < 8;
            row++
          ) {

            for (
              let col = 0;
              col < 8;
              col++
            ) {

              const square =
                document.createElement(
                  "div"
                );


              square.classList.add(
                "square"
              );


              if (
                (row + col) % 2 === 0
              ) {

                square.classList.add(
                  "light"
                );

              } else {

                square.classList.add(
                  "dark"
                );
              }


              const file =
                String.fromCharCode(
                  97 + col
                );

              const rank =
                8 - row;

              const squareName =
                file + rank;


              if (
                selectedSquare ===
                squareName
              ) {

                square.classList.add(
                  "selected"
                );
              }


              const move =
                validMoves.find(
                  m =>
                    m.to === squareName
                );


              if (move) {

                if (
                  board[row][col]
                ) {

                  square.classList.add(
                    "capture-move"
                  );

                } else {

                  square.classList.add(
                    "valid-move"
                  );
                }
              }


              const piece =
                board[row][col];


              if (piece) {

                const pieceElement =
                  document.createElement(
                    "span"
                  );

                /*
                  Add color class based on
                  the chess piece color.
                */

                pieceElement.classList.add(
                  "piece"
                );

                if (piece.color === "w") {

                  pieceElement.classList.add(
                    "white-piece"
                  );

                } else {

                  pieceElement.classList.add(
                    "black-piece"
                  );
                }

                pieceElement.textContent =
                  pieces[
                    piece.color
                  ][
                    piece.type
                  ];


                if (
                  piece.type === "k" &&
                  piece.color === chess.turn() &&
                  chess.isCheck()
                ) {

                  square.classList.add(
                    "check"
                  );
                }


                square.appendChild(
                  pieceElement
                );
              }


              square.addEventListener(
                "click",
                function() {

                  handleSquareClick(
                    squareName
                  );

                }
              );


              boardElement.appendChild(
                square
              );
            }
          }
        }


        /*
        =====================================================
        SQUARE CLICK
        =====================================================
        */

        function handleSquareClick(
          square
        ) {

          if (!chess) {
            return;
          }


          if (
            chess.isGameOver()
          ) {

            return;
          }


          /*
            Try selected move.
          */

          if (selectedSquare) {

            const move =
              validMoves.find(
                m =>
                  m.to === square
              );


            if (move) {

              makeMove(
                selectedSquare,
                square
              );

              return;
            }
          }


          /*
            Select piece.
          */

          const piece =
            chess.get(square);


          if (!piece) {

            selectedSquare = null;

            validMoves = [];

            drawBoard();

            return;
          }


          /*
            Wrong player's piece.
          */

          if (
            piece.color !==
            chess.turn()
          ) {

            return;
          }


          selectedSquare =
            square;


          /*
            IMPORTANT:
            chess.js only returns LEGAL moves.
          */

          validMoves =
            chess.moves({

              square: square,

              verbose: true

            });


          drawBoard();
        }


        /*
        =====================================================
        MAKE MOVE
        =====================================================
        */

        function makeMove(
          from,
          to
        ) {

          const piece =
            chess.get(from);


          let promotion;


          /*
            Pawn promotion.
          */

          if (
            piece &&
            piece.type === "p" &&
            (
              to.endsWith("8") ||
              to.endsWith("1")
            )
          ) {

            promotion =
              askPromotion();
          }


          try {

            chess.move({

              from: from,

              to: to,

              promotion:
                promotion || "q"

            });


            selectedSquare = null;

            validMoves = [];

            drawBoard();

            updateStatus();


          } catch (error) {

            console.log(
              "Illegal move:",
              error.message
            );

            selectedSquare = null;

            validMoves = [];

            drawBoard();

            updateStatus();
          }
        }


        /*
        =====================================================
        PROMOTION
        =====================================================
        */

        function askPromotion() {

          const answer =
            prompt(
              "Promote to:\n\n" +
              "Q = Queen\n" +
              "R = Rook\n" +
              "B = Bishop\n" +
              "N = Knight",
              "Q"
            );


          const choice =
            (
              answer || "Q"
            ).toLowerCase();


          if (
            ["q", "r", "b", "n"]
              .includes(choice)
          ) {

            return choice;
          }


          return "q";
        }


        /*
        =====================================================
        STATUS
        =====================================================
        */

        function updateStatus() {

          if (!chess) {
            return;
          }


          if (
            chess.isCheckmate()
          ) {

            const winner =
              chess.turn() === "w"
                ? "Black"
                : "White";


            statusElement.textContent =
              "Checkmate — " +
              winner +
              " wins!";

            return;
          }


          if (
            chess.isStalemate()
          ) {

            statusElement.textContent =
              "Stalemate — Draw!";

            return;
          }


          if (
            chess.isThreefoldRepetition()
          ) {

            statusElement.textContent =
              "Draw — Threefold repetition.";

            return;
          }


          if (
            chess.isInsufficientMaterial()
          ) {

            statusElement.textContent =
              "Draw — Insufficient material.";

            return;
          }


          const player =
            chess.turn() === "w"
              ? "White"
              : "Black";


          if (
            chess.isCheck()
          ) {

            statusElement.textContent =
              player +
              " is in check!";

          } else {

            statusElement.textContent =
              player +
              "'s turn";
          }
        }


        /*
        =====================================================
        START
        =====================================================
        */

        checkSession();

      }
    );

  </script>

</body>
</html>
